<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100-Clicks Speed & Burst Tester</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: #0f111a;
            color: #f1f1f1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.2rem;
            color: #89b4fa;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #a6adc8;
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #1e1e2e;
            border: 1px solid #fab387;
            color: #fab387;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        #click-zone {
            width: 440px;
            height: 240px;
            background: linear-gradient(135deg, #1e1e2e, #2b2b3d);
            border: 3px dashed #a6e3a1;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease, border-color 0.1s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #click-zone:active {
            transform: scale(0.97);
            border-color: #f38ba8;
        }
        #counter {
            font-size: 5rem;
            font-weight: 900;
            color: #a6e3a1;
            line-height: 1;
            margin-bottom: 10px;
        }
        .label {
            font-size: 1.1rem;
            color: #cdd6f4;
            font-weight: 600;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 24px;
        }
        .stat-card {
            background: #1e1e2e;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #313244;
        }
        .stat-val {
            font-size: 1.5rem;
            font-weight: bold;
            color: #89b4fa;
        }
        .stat-desc {
            font-size: 0.85rem;
            color: #6c7086;
        }
        button.btn-reset {
            margin-top: 24px;
            background: #f38ba8;
            color: #11111b;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button.btn-reset:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="badge">⚡ 100-Clicks Live Verification Test</div>
    <h1>🖱️ Right-Click Tester</h1>
    <p class="subtitle">Click the box below once with <strong>Right Click</strong> (or Left Click) to see the counter burst!</p>

    <div id="click-zone">
        <div id="counter">0</div>
        <div class="label">👉 RIGHT CLICK HERE 👈</div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div id="right-clicks" class="stat-val">0</div>
            <div class="stat-desc">Total Right Clicks</div>
        </div>
        <div class="stat-card">
            <div id="left-clicks" class="stat-val">0</div>
            <div class="stat-desc">Total Left Clicks</div>
        </div>
        <div class="stat-card">
            <div id="cps" class="stat-val">0</div>
            <div class="stat-desc">Clicks / Sec</div>
        </div>
    </div>

    <button class="btn-reset" onclick="resetCounter()">Reset Counter</button>

    <script>
        let total = 0;
        let rightClicks = 0;
        let leftClicks = 0;
        let recentClicks = [];

        const zone = document.getElementById('click-zone');
        const counterEl = document.getElementById('counter');
        const rightClicksEl = document.getElementById('right-clicks');
        const leftClicksEl = document.getElementById('left-clicks');
        const cpsEl = document.getElementById('cps');

        // Prevent context menu so right click doesn't pop up browser menu
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        function registerClick(type) {
            total++;
            if (type === 'right') {
                rightClicks++;
            } else {
                leftClicks++;
            }

            const now = performance.now();
            recentClicks.push(now);

            counterEl.innerText = total;
            rightClicksEl.innerText = rightClicks;
            leftClicksEl.innerText = leftClicks;
        }

        // Measure CPS
        setInterval(() => {
            const now = performance.now();
            recentClicks = recentClicks.filter(t => now - t <= 1000);
            cpsEl.innerText = recentClicks.length;
        }, 100);

        zone.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (e.button === 2) {
                registerClick('right');
            } else if (e.button === 0) {
                registerClick('left');
            }
        });

        function resetCounter() {
            total = 0;
            rightClicks = 0;
            leftClicks = 0;
            recentClicks = [];
            counterEl.innerText = '0';
            rightClicksEl.innerText = '0';
            leftClicksEl.innerText = '0';
            cpsEl.innerText = '0';
        }
    </script>
</body>
</html>
